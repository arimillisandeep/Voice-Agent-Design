# =============================================================================
# TRACEABILITY MATRIX — original 64-section master prompt -> v2.0 implementation
# =============================================================================
# Every instruction in the supplied prompt is mapped to where it now lives.
# `tools/verify_coverage.py` mechanically checks that each reference resolves:
# prompt headings, literal prompt text, importable code symbols, test functions,
# scenario files and config key paths. A stale claim fails the build.
#
# status values:
#   prompt       - instruction lives in the system prompt (model behaviour)
#   code         - instruction is enforced deterministically in Python
#   both         - stated in the prompt AND enforced in code
#   tests        - original worked example, now a replayable scenario + assertions
#   strengthened - v2 adds handling the original lacked
#   gap          - NOT implemented; needs a business decision (see `note`)
# =============================================================================

sections:

